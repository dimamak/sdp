# dailypost — instance configuration (copy to config.yaml and edit; config.yaml is git-ignored)
# All paths may use ~. Secrets go in .env, never here.

install_root: /opt/dailypost          # server install root
store_dir: /opt/dailypost/data        # SQLite store + files/
ingest_dir: /opt/dailypost/ingest     # where the laptop push lands
logs_dir: /opt/dailypost/logs
run_as_user: youruser                 # non-root user that owns everything and runs jobs

pipeline:
  timezone: Asia/Jerusalem            # day boundaries + "yesterday" logic
  cron_utc: "30 0-9 * * *"            # server crontab, UTC. A RANGE of hours, not
                                      # one: attempts repeat until the laptop has
                                      # checked in, then stop (a drafted day is a
                                      # no-op). Keep the last hour before
                                      # wait_deadline_hour in local time.
  window_hours: 26                    # how far back the digest looks for un-used items
  digest_max_chars: 400000            # hard cap on digest size fed to the LLM
  per_item_max_chars: 4000            # cap per harvested item in the digest
  # The laptop carries coding sessions, screenshots and office audio, so drafting
  # before it has pushed throws away the day's best material. If it was asleep at
  # the scheduled hour, wait for its morning push instead — the cron runs on a
  # range of hours and the first attempt with data does the work.
  wait_for_laptop: true
  wait_deadline_hour: 12              # local hour after which we draft regardless,
                                      # so a laptop left off all week still posts
  max_drafts: 4                       # how many stories to draft per day (one message each)
  model: claude-haiku-4-5             # model for claude -p (draft + screenshot descriptions)
  claude_bin: claude                  # path to the claude CLI
  language_out: English               # language of the LinkedIn post
  always_hashtags: []                 # e.g. ["buildinpublic", "AICoding"] — no leading '#'.
                                      # Included verbatim in every X rewrite only (not the
                                      # LinkedIn post); the drafting agent is asked to add a
                                      # couple more relevant tags on top of these.
                                      # Set interactively with: python -m setup.wizard --source base
  # optional overrides for the drafting prompts — put your personal versions
  # outside the repo (they survive deploys and stay out of git):
  # style_guide: /opt/dailypost/data/style-guide.md
  # draft_prompt: /opt/dailypost/data/draft-prompt.md

# ---------------------------------------------------------------------------
# Sources: a LIST of adapter instances. Each entry has a `type` (registered in
# server/harvest/) and `enabled`. Add/remove/duplicate entries freely.
# ---------------------------------------------------------------------------
sources:
  # Claude Code JSONL transcripts in a plain per-user directory (single-user machine).
  - type: claude_projects_dir
    enabled: true
    name: claude-server-cli
    projects_dir: ~/.claude/projects

  # Claude Code JSONL transcripts filtered to *your* sessions on a shared/multi-user
  # host (e.g. a coding-agent platform / hosted IDE). The harvester only needs a list
  # of session IDs; how that list is produced is the `filter` strategy:
  #   all      — every session in projects_dir (same as claude_projects_dir)
  #   sql      — run a SQL query against a SQLite DB; must return claude session-id rows.
  #              $SINCE in params is replaced with the ISO timestamp of the last run.
  #   command  — run a shell command that prints one session id per line
  #   id_file  — read session ids from a text file (one per line)
  - type: claude_sessions
    enabled: false
    name: claude-ide
    projects_dir: /home/ideuser/.claude/projects
    filter:
      strategy: sql
      db_path: /path/to/platform.db
      query: >
        SELECT s.claude_session_id FROM sessions s
        JOIN users u ON u.id = s.user_id
        WHERE u.username = :username AND s.updated_at >= :since
      params:
        username: yourname
        since: $SINCE

  # Files pushed from the laptop (Claude JSONL, screenshots, audio) — see laptop/push_daily.sh.
  - type: ingest_dir
    enabled: true
    name: laptop
    path: /opt/dailypost/ingest/laptop

  # Telegram personal history via Telethon (MTProto). Needs one-time interactive
  # login (setup wizard) to create the session file. api_id/api_hash in .env.
  - type: telegram
    enabled: false
    session_file: /opt/dailypost/data/telethon.session
    max_dialogs: 40                    # newest dialogs scanned per night
    max_messages_per_dialog: 300
    require_my_participation: true     # keep a chat only if YOU wrote in it during
                                       # the window (skips lurked channels/groups)
    exclude_chats: []                  # substrings of chat titles to never harvest —
                                       # put your approval bot here, or its drafts
                                       # feed back into the next day's digest

  # Gmail digest (sent + received, subjects + snippets). One-time OAuth via wizard.
  - type: gmail
    enabled: false
    token_file: /opt/dailypost/data/gmail-token.json
    credentials_file: /opt/dailypost/data/gmail-oauth-client.json
    # Emails from these senders are treated as meeting transcripts (full body kept):
    transcript_senders: ["@fathom.video", "@tldv.io", "@tactiq.io"]

  # WhatsApp via self-hosted WAHA (read-only). Messages arrive continuously through
  # the webhook receiver in the bot service; this entry only declares it for doctor/digest.
  - type: whatsapp
    enabled: false
    waha_url: http://127.0.0.1:3000
    webhook_port: 8477                 # port the bot service listens on for WAHA events
    webhook_host: 127.0.0.1            # set to the docker bridge gateway (usually
                                       # 172.17.0.1) so the WAHA container can reach it;
                                       # the wizard detects this for you

bot:
  # Telegram bot for draft delivery + Approve/Edit/Skip. Token + allowed chat id in .env.
  enabled: true

linkedin:
  token_file: /opt/dailypost/data/linkedin-token.json
  api_version: "202607"                # LinkedIn-Version header on /rest/* calls.
                                       # Versions are sunset after about a year and a
                                       # dead one fails every call with 426 "not active"
                                       # — check with: python -m server.bot.linkedin_client --check
  escape_commentary: true              # /rest/posts commentary is 'little text': the
                                       # characters \|{}@[]()<>#*_~ must be escaped or
                                       # the post 422s. Hashtags are converted to real
                                       # hashtags rather than escaped. Leave this on.
  rest_fallback_v2: true               # if /rest/posts 403s because the app was never
                                       # granted versioned-API access, retry TEXT-ONLY
                                       # posts on the legacy /v2/ugcPosts path instead
                                       # of going silent. Drop once /rest/ has worked.
  # dry_run: true                      # log the request body, publish nothing

# ---------------------------------------------------------------------------
# Also post to X (Twitter), once the LinkedIn post has actually gone out.
# Once a LinkedIn post publishes, Claude (same day session) writes a SEPARATE,
# shorter X-native rewrite — not a truncation of the LinkedIn text — and it gets
# its own Post to X / Rewrite / Replace text / Skip X buttons in Telegram.
# Nothing reaches X until that second tap, and nothing here can affect a LinkedIn
# post that already succeeded. Keys go in .env: X_API_KEY, X_API_SECRET,
# X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET (OAuth 1.0a — no token file, doesn't
# expire on its own). Set up with: python -m setup.wizard --source x
# The X API Free tier caps writes at ~500 posts/month per app — plenty for one
# post a day, but relevant if you also run test posts against the same app.
# ---------------------------------------------------------------------------
x:
  enabled: false
  max_chars: 280                       # X's default cap; raise only if the posting
                                       # account has X Premium (note_tweet, up to
                                       # ~25,000 chars) — this app does not use that field
  max_rewrites: 5                      # "Rewrite" cap per draft, like image.max_regenerations.
                                       # 0 = no cap. Failed attempts don't count against it.
  pending_hours: 12                    # how long a candidate stays steerable by free text
  # dry_run: true                      # log the request body, publish nothing

# ---------------------------------------------------------------------------
# Post illustrations (Gemini API — an API key, no GCP project needed).
# Approve becomes two steps: it draws an image for the post and sends it back for
# confirmation; nothing reaches LinkedIn until you tap Post with image (or Post
# text-only). Replying to the image with plain language re-renders it.
# API key goes in .env as GEMINI_API_KEY (aistudio.google.com/apikey — image
# models need billing enabled on the key's project; the free tier returns 429).
# ---------------------------------------------------------------------------
image:
  enabled: true                        # false = Approve publishes immediately, as before
  provider: gemini
  model: gemini-3-pro-image            # "nano banana pro". gemini-3.1-flash-image is
                                       # ~3x cheaper and weaker at text inside the image
  aspect_ratio: "1:1"                  # 1:1 2:3 3:2 3:4 4:3 4:5 5:4 9:16 16:9 21:9
  image_size: "2K"                     # 1K | 2K | 4K  (2K ≈ 2 MB JPEG)
  timeout: 180                         # seconds for one render, retries included
  max_regenerations: 6                 # takes per draft; each one costs a render.
                                       # 0 = no cap. A take that fails to render
                                       # (safety refusal, quota, timeout) never
                                       # reaches you for review, so it doesn't count.
  pending_hours: 12                    # after this, plain messages stop being read as
                                       # image feedback (bot restarts, forgotten drafts)
  retention_days: 30                   # prune UNPOSTED takes; images actually published
                                       # are kept forever (the only local copy)
  strip_content_credentials: true      # drop the C2PA metadata Gemini attaches, which
                                       # LinkedIn renders as a "Cr" badge over the image.
                                       # Lossless (one APP11 segment removed, pixels
                                       # untouched). The SynthID watermark is in the
                                       # pixels and stays either way — this removes the
                                       # visible disclosure, not the detectability.
  # Appended to every prompt — your house look. Keep it short and visual.
  # The full-frame clause is load-bearing: asked for a cinematic look, the model
  # paints black letterbox bars into the canvas and they show as dead bands.
  style_suffix: >
    Grounded, literal illustration of the real scene — not an abstract metaphor
    or symbolic composition. Naturalistic color and detail. No text, no
    recognisable real people; a named company's real logo is fine.
    Fills the entire frame edge to edge — no letterboxing, no black bars, no borders.

# Laptop side (read by wizard_laptop.ps1 to generate laptop/push.conf; the bash
# push script itself reads push.conf, not this file)
laptop:
  remote: myserver                     # ssh alias from ~/.ssh/config
  remote_ingest_dir: /opt/dailypost/ingest/laptop
  remote_post_cmd: ""                  # optional, e.g. "chown -R youruser: /opt/dailypost/ingest/laptop"
  push_paths:
    - name: claude
      dir: ~/.claude/projects
      include: "*.jsonl"
    - name: screenshots
      dir: ~/Pictures/Screenshots
      include: "*.png"

# Local speech-to-text for harvested audio (always-on office capture, call
# debriefs). Runs before the digest on the nightly cron.
transcription:
  enabled: false
  # Pick the model to match how people actually speak in the room:
  #   large-v3-turbo               multilingual, use with language: auto
  #   ivrit-ai/whisper-large-v3-turbo-ct2   better Hebrew, but Hebrew ONLY - it
  #     renders any other language as confident same-script gibberish, so only
  #     use it with language: he when the room is reliably monolingual
  model: large-v3-turbo
  language: auto                       # auto | he | ru | en ...
                                       # `auto` detects per file and records the
                                       # result (and its confidence) on the item
  device: cpu
  compute_type: int8
  cpu_threads: 4
  beam_size: 1                         # 1 is much faster and fine for summarising
  silence_threshold_db: -35            # below this counts as silence
  min_silence_seconds: 1.5             # gaps longer than this are removed
  min_speech_seconds: 4                # files with less speech than this are dropped
  delete_audio_after: true             # discard raw audio once transcribed
                                       # (set false temporarily to A/B model or
                                       # language settings on real recordings)
  max_files_per_run: 200

retention_days: 30                     # prune raw files under store files/ after N days
